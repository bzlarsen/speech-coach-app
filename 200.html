<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#11161c" />
    <meta name="color-scheme" content="dark" />
    <script>
      (function () {
        try {
          var theme = "system";
          var raw = localStorage.getItem("speech-coach-settings");
          if (raw) {
            var doc = JSON.parse(raw);
            if (doc && (doc.theme === "light" || doc.theme === "dark" || doc.theme === "system")) theme = doc.theme;
          }
          var dark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var bar = dark ? "#11161c" : "#b7c2ce";
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.setAttribute("content", bar);
          var scheme = document.querySelector('meta[name="color-scheme"]');
          if (scheme) scheme.setAttribute("content", dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Impromptu speaking practice. Your video stays on this device." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Speech Coach" />
    <link rel="icon" href="/speech-coach-app/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/speech-coach-app/apple-touch-icon.png" />
    <title>Speech Coach</title>

    <link rel="stylesheet" crossorigin href="/speech-coach-app/assets/index-Bu6jTDBx.css">
  <link rel="manifest" href="/speech-coach-app/manifest.webmanifest"></head>
  <body>
    <div id="app"></div>
  </body>
</html>
